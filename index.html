<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cardápio de Dopamina</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: #fff;
    padding: 40px 20px 80px;
  }

  .wrapper { max-width: 760px; margin: 0 auto; }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 48px; }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 40px;
    padding: 6px 20px;
    margin-bottom: 20px;
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #A78BFA;
  }

  h1 {
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 400;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .gradient-text {
    background: linear-gradient(90deg, #F59E0B, #EF4444, #8B5CF6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: rgba(255,255,255,0.45);
    font-size: 16px;
    font-style: italic;
  }

  .counter {
    display: none;
    margin-top: 20px;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .counter.visible { display: flex; }
  .counter-pill {
    background: rgba(167,139,250,0.15);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 20px;
    padding: 6px 16px;
    color: #A78BFA;
    font-size: 14px;
  }

  /* ── CARD ── */
  .card {
    margin-bottom: 24px;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
    gap: 12px;
  }

  .card-meta { display: flex; align-items: center; gap: 14px; }

  .icon-box {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .section-title-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .section-name {
    font-size: 20px; font-weight: 400; color: #fff;
  }

  .time-pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    font-family: monospace;
    letter-spacing: 1px;
  }

  .section-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    font-style: italic;
  }

  .btn-roll {
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 13px;
    font-family: monospace;
    letter-spacing: 1px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    transition: opacity .15s ease;
  }
  .btn-roll:hover { opacity: 0.8; }

  /* ── IDLE DOTS ── */
  .idle-row {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .idle-label {
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    margin-left: 6px;
    font-family: monospace;
  }

  /* ── REVEALED ── */
  .revealed-area {
    padding: 20px 24px;
    animation: slideIn .35s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(-10px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .revealed-inner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .item-title-row {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .item-name { font-size: 17px; font-weight: 400; color: #fff; }

  .tag-pill {
    font-size: 10px;
    padding: 2px 9px;
    border-radius: 20px;
    font-family: monospace;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .item-desc {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
  }

  .btn-done {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.3);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s ease;
  }
  .btn-done.checked {
    background: #27AE60;
    border-color: #27AE60;
    color: #fff;
    animation: checkPop .4s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes checkPop {
    0%  { transform:scale(0.5); opacity:0; }
    60% { transform:scale(1.2); }
    100%{ transform:scale(1);   opacity:1; }
  }

  .footer {
    text-align: center;
    margin-top: 40px;
    color: rgba(255,255,255,0.2);
    font-size: 13px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="badge">Menu do Dia</div>
    <h1>Cardápio de <span class="gradient-text">Dopamina</span></h1>
    <p class="subtitle">Para cérebros que precisam de mais do que o comum oferece</p>
    <div class="counter" id="counter">
      <div class="counter-pill" id="counter-text"></div>
    </div>
  </div>

  <!-- Cards rendered by JS -->
  <div id="menu"></div>

  <p class="footer">Não existe ordem certa. Existe o que o seu cérebro pede agora.</p>
</div>

<script>
const sections = [
  {
    key: "aperitivos",
    label: "Aperitivos", time: "5 min", emoji: "⚡", accent: "#FF6B35",
    description: "Movimento rápido para acordar o cérebro",
    items: [
      { name: "Salto no escuro",     desc: "Abra um livro aleatório, leia 1 parágrafo e escreva 1 frase de reação.", tag: "leitura relâmpago" },
      { name: "Estica e foca",       desc: "10 alongamentos guiados mentalmente: pescoço, ombros, costas, quadril. Sinta cada músculo.", tag: "corpo ativo" },
      { name: "Câmera na janela",    desc: "Fotografe 3 coisas pela janela com perspectivas que você nunca tentou antes.", tag: "olhar novo" },
      { name: "Playlist surpresa",   desc: "Coloque shuffle numa playlist que você nunca ouviu. Dance pelos primeiros 90 segundos, sem cerimônia.", tag: "movimento livre" },
      { name: "Equação do dia",      desc: "Resolva 3 puzzles de lógica no Lumosity ou no papel. Cronometra e tenta bater o tempo.", tag: "raciocínio rápido" },
      { name: "Chuva de palavras",   desc: "Escolha uma cor. Em 3 minutos, escreva todas as palavras que ela evoca. Sem censura.", tag: "associação livre" },
    ],
  },
  {
    key: "pratos",
    label: "Pratos Principais", time: "20 min", emoji: "🔥", accent: "#C0392B",
    description: "Trabalho profundo com foco total",
    items: [
      { name: "Pomodoro de escrita",   desc: "Escreva sem parar por 20 minutos sobre qualquer tema. Nada de editar — só vazar.", tag: "fluxo contínuo" },
      { name: "Problema do dia",       desc: "Escolha um desafio do trabalho. Destrinche em partes menores, estime 3 soluções e escolha uma para testar.", tag: "resolução profunda" },
      { name: "Pesquisa de toca",      desc: "Escolha um tema que te intriga. Abra 5 abas, leia todas, e monte 1 mapa mental com o que aprendeu.", tag: "aprendizagem ativa" },
      { name: "Carta para o futuro",   desc: "Escreva para você daqui 5 anos. O que está construindo? O que teme? O que deseja? Sem filtro.", tag: "reflexão profunda" },
      { name: "Skill sprint",          desc: "Dedique 20 minutos ao aprendizado de uma habilidade técnica: código, idioma, instrumento. Um módulo por vez.", tag: "aprendizado técnico" },
      { name: "Debate com você mesmo", desc: "Escolha uma opinião que você tem. Escreva o melhor argumento contrário que conseguir. Muda seu ponto de vista?", tag: "pensamento crítico" },
    ],
  },
  {
    key: "desenho",
    label: "Desenho", time: "15 min", emoji: "✏️", accent: "#3B82F6",
    description: "Expressão visual sem julgamento",
    items: [
      { name: "Retrato de memória",    desc: "Desenhe o rosto de alguém que você ama sem olhar para foto nenhuma. Só o que a memória guarda.", tag: "memória visual" },
      { name: "Mão cega",              desc: "Escolha um objeto na sua frente. Desenhe-o sem tirar o lápis do papel e sem olhar para o papel.", tag: "observação pura" },
      { name: "Mapa do bairro",        desc: "Desenhe de memória o mapa do bairro onde você cresceu. Ruas, casas, atalhos que só você conhecia.", tag: "cartografia afetiva" },
      { name: "Anatomia de planta",    desc: "Pegue uma folha ou flor. Desenhe em detalhe como se fosse um caderno científico do século XIX.", tag: "observação científica" },
      { name: "Cena em 5 linhas",      desc: "Descreva mentalmente uma cena do dia. Agora tente representá-la usando no máximo 5 linhas.", tag: "síntese visual" },
      { name: "Autorretrato às cegas", desc: "Olhe no espelho por 30 segundos. Feche os olhos. Desenhe o que ficou.", tag: "percepção de si" },
    ],
  },
  {
    key: "acompanhamentos",
    label: "Acompanhamentos", time: "10 min", emoji: "🎨", accent: "#27AE60",
    description: "Brincadeira criativa sem objetivo",
    items: [
      { name: "Doodle sem tema",     desc: "Papel em branco. Caneta. Comece com uma linha e veja onde ela vai. Proibido planejar.", tag: "desenho livre" },
      { name: "Remix de receita",    desc: "Pegue uma receita simples que você conhece e substitua 2 ingredientes por coisas que tiver em casa.", tag: "criatividade culinária" },
      { name: "Haiku do momento",    desc: "Observe o ambiente agora. Escreva um haiku (5-7-5 sílabas) sobre o que está vendo ou sentindo.", tag: "poesia instantânea" },
      { name: "Jogo de personagem",  desc: "Crie um personagem de uma frase: nome, profissão bizarra, e maior medo. Depois, escreva seu monólogo interno.", tag: "ficção rápida" },
      { name: "Arranjo improvisado", desc: "Pegue 5 objetos aleatórios da mesa. Monte uma composição visual e fotografe como se fosse arte.", tag: "arte acidental" },
      { name: "Playlist da cena",    desc: "Escolha uma memória vívida. Monte uma playlist de 5 músicas que seriam a trilha sonora dessa cena.", tag: "memória sensorial" },
    ],
  },
];

const state = {};
sections.forEach(s => { state[s.key] = { revealed: false, item: null, done: false }; });

let totalDone = 0;

function hex(color, alpha) {
  // returns rgba string from hex + 0-1 alpha, used inline
  const r = parseInt(color.slice(1,3),16);
  const g = parseInt(color.slice(3,5),16);
  const b = parseInt(color.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function render() {
  const container = document.getElementById("menu");
  container.innerHTML = "";

  sections.forEach(section => {
    const s = state[section.key];
    const accent = section.accent;

    const card = document.createElement("div");
    card.className = "card";

    // Header
    const header = document.createElement("div");
    header.className = "card-header";
    header.style.background = `linear-gradient(90deg, ${hex(accent,0.1)}, transparent)`;

    const meta = document.createElement("div");
    meta.className = "card-meta";

    const iconBox = document.createElement("div");
    iconBox.className = "icon-box";
    iconBox.style.background = hex(accent, 0.13);
    iconBox.style.border = `1px solid ${hex(accent, 0.27)}`;
    iconBox.textContent = section.emoji;

    const textGroup = document.createElement("div");

    const titleRow = document.createElement("div");
    titleRow.className = "section-title-row";

    const nameEl = document.createElement("span");
    nameEl.className = "section-name";
    nameEl.textContent = section.label;

    const timePill = document.createElement("span");
    timePill.className = "time-pill";
    timePill.style.background = hex(accent, 0.13);
    timePill.style.border = `1px solid ${hex(accent, 0.33)}`;
    timePill.style.color = accent;
    timePill.textContent = section.time;

    titleRow.appendChild(nameEl);
    titleRow.appendChild(timePill);

    const descEl = document.createElement("p");
    descEl.className = "section-desc";
    descEl.textContent = section.description;

    textGroup.appendChild(titleRow);
    textGroup.appendChild(descEl);
    meta.appendChild(iconBox);
    meta.appendChild(textGroup);

    const btn = document.createElement("button");
    btn.className = "btn-roll";
    btn.style.background = `linear-gradient(135deg, ${accent}, ${hex(accent, 0.67)})`;
    btn.textContent = "SORTEAR";
    btn.addEventListener("click", () => roll(section.key));

    header.appendChild(meta);
    header.appendChild(btn);
    card.appendChild(header);

    // Body
    if (s.revealed && s.item) {
      const area = document.createElement("div");
      area.className = "revealed-area";

      const inner = document.createElement("div");
      inner.className = "revealed-inner";

      const content = document.createElement("div");
      content.style.flex = "1";

      const itemTitleRow = document.createElement("div");
      itemTitleRow.className = "item-title-row";

      const itemName = document.createElement("span");
      itemName.className = "item-name";
      itemName.textContent = s.item.name;

      const tagPill = document.createElement("span");
      tagPill.className = "tag-pill";
      tagPill.style.background = hex(accent, 0.1);
      tagPill.style.color = accent;
      tagPill.textContent = s.item.tag;

      itemTitleRow.appendChild(itemName);
      itemTitleRow.appendChild(tagPill);

      const itemDesc = document.createElement("p");
      itemDesc.className = "item-desc";
      itemDesc.textContent = s.item.desc;

      content.appendChild(itemTitleRow);
      content.appendChild(itemDesc);

      const doneBtn = document.createElement("button");
      doneBtn.className = "btn-done" + (s.done ? " checked" : "");
      doneBtn.textContent = "✓";
      doneBtn.title = "Marcar como feito";
      doneBtn.addEventListener("click", () => markDone(section.key));

      inner.appendChild(content);
      inner.appendChild(doneBtn);
      area.appendChild(inner);
      card.appendChild(area);
    } else {
      const idle = document.createElement("div");
      idle.className = "idle-row";
      section.items.forEach(() => {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.background = hex(accent, 0.2);
        dot.style.border = `1px solid ${hex(accent, 0.33)}`;
        idle.appendChild(dot);
      });
      const label = document.createElement("span");
      label.className = "idle-label";
      label.textContent = `${section.items.length} opções disponíveis`;
      idle.appendChild(label);
      card.appendChild(idle);
    }

    container.appendChild(card);
  });

  // Counter
  const counter = document.getElementById("counter");
  const counterText = document.getElementById("counter-text");
  if (totalDone > 0) {
    counter.classList.add("visible");
    counterText.textContent = `✓ ${totalDone} prato${totalDone > 1 ? "s" : ""} concluído${totalDone > 1 ? "s" : ""} hoje`;
  } else {
    counter.classList.remove("visible");
  }
}

function roll(key) {
  const section = sections.find(s => s.key === key);
  const items = section.items;
  state[key].item = items[Math.floor(Math.random() * items.length)];
  state[key].revealed = true;
  state[key].done = false;
  render();
}

function markDone(key) {
  state[key].done = true;
  totalDone++;
  render();
  setTimeout(() => {
    state[key].revealed = false;
    state[key].done = false;
    render();
  }, 1800);
}

render();
</script>
</body>
</html>
